# Ender-3 V3 SE (C13): what differs from NebulaOS's own KE configuration.
# Included AFTER NebulaOS's print.cfg, homing.cfg, calibration.cfg and
# prtouch.cfg, so these values replace theirs and everything else - including
# later NebulaOS fixes to those files - still comes from NebulaOS.
# Values: Hazok652 (NebulaOS issue #8), from his tested SE setup.

# Purge line (print.cfg)
[gcode_macro _KAMP_Settings]
variable_purge_height: 0.8
variable_tip_distance: 0.8
variable_purge_amount: 20
variable_flow_rate: 10
variable_line_purge_retract: 0.8

# Home in the middle of the SE's bed (homing.cfg)
[safe_z_home]
home_xy_position: 134, 130

# Bed screw positions for SCREWS_TILT_CALCULATE (calibration.cfg)
[screws_tilt_adjust]
screw1: 52, 42
screw2: 220, 42
screw3: 220, 210
screw4: 52, 210

# Probe offset used by z_compensate (prtouch.cfg)
[z_compensate]
bl_offset: -24,-20
